name: Feature
description: Something a player can see or do (owners create these at triage)
title: "Feature: As a [role], I can [capability] because [value]"
labels: [feature]
body:
  - type: input
    id: user_story
    attributes:
      label: User Story
      description: "Format: As a [role], I can [capability] because [value/reason]"
      placeholder: "As a [role], I can [capability] because [value]"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context & User Story Description
      description: Why this capability matters, background context, and motivation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected Outcome
      description: What the player or user can see or do once this is done.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: A checklist an owner can verify by hand.
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec link
      description: Section of SPEC.md or docs/specs/ that defines it.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source discussion
      description: Link to the Ideas discussion, if any.
