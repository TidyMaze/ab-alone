name: Task
description: One PR worth of work, child of a Feature or Epic
title: "Task: "
labels: [task]
body:
  - type: input
    id: parent
    attributes:
      label: Parent
      description: "#<feature or epic>. Also add this issue as its sub-issue."
    validations:
      required: true
  - type: input
    id: outcome
    attributes:
      label: Outcome in one sentence
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done checklist
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Hints, links, constraints. Optional.
