name: Bug
description: Something works differently from its spec. File it before touching any code.
title: "Bug: [Clear description of what fails under what condition]"
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact numbered sequence of steps to reproduce the bug.
      value: "1. "
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior & Screenshot
      description: What happens. Attach a screenshot, screen recording, console log, or failing test output. No secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour once fixed
      description: What the spec or acceptance criteria say should happen once the bug is fixed.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, OS and commit
      placeholder: "Chrome 141, macOS, a1b2c3d (or the live site)"
    validations:
      required: true
  - type: input
    id: feature
    attributes:
      label: Broken feature
      description: "#<feature>, if known"
