name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, coverage with tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Runs every test and enforces the gate in one pass: no second test build.
      - name: Test and coverage gate (100% lines and regions)
        run: cargo llvm-cov --workspace --locked --fail-under-lines 100 --fail-under-regions 100
