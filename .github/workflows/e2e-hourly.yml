name: E2E hourly
# Runs the full CI (with e2e) about hourly when main moved (#1433). schedule alone never fired (#1436): a green push CI also triggers it.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    # The dispatched CI run has event workflow_dispatch, so it never retriggers this.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          head=$(gh api repos/$GH_REPO/commits/main --jq .sha)
          # last dispatched run: its head, or "stop" when it is running or started under 60 min ago
          last=$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --limit 1 --json headSha,status,createdAt --jq '.[0] // {headSha:"",status:"completed",createdAt:"1970-01-01T00:00:00Z"} | if .status != "completed" or (now - (.createdAt | fromdateiso8601)) < 3600 then "stop" else .headSha end')
          [ "$last" = stop ] || [ "$head" = "$last" ] || gh workflow run ci.yml --ref main
