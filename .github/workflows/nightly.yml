name: Nightly

# Free and deterministic: no LLM, no agent, no secret beyond the run's own GITHUB_TOKEN.
# What happens on a failure and what stays manual: docs/specs/ci-repair.md.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  e2e-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # gh run list: the last green nightly, for the bisect hint
      contents: read
      issues: write
    env:
      E2E_BASE_URL: https://tidymaze.github.io/ab-alone/
      # The textures spec counts every /assets/ response; the production build also serves its JS, CSS and wasm there, so it cannot pass live.
      # Never leave it empty: an empty --grep-invert skips every spec.
      E2E_GREP_INVERT: textures are requested
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the bisect hint runs git log since the last green nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      # One worker: with parallel WebGL pages, requestAnimationFrame stalls and clear-board/eject time out.
      # --retries=1 is the automatic re-run: a failed spec runs once more, with a trace. Passing then makes it flaky, not a failure.
      - run: npx playwright test --project=chromium --workers=1 --retries=1 --grep-invert "$E2E_GREP_INVERT" --reporter=list,html,json
        working-directory: client
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/nightly.json
      - id: report
        name: Sort the run into pass, flaky or fail and write the issue
        if: ${{ !cancelled() }}
        run: node scripts/nightly-report-cli.mjs
        working-directory: client
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_REPORT: test-results/nightly.json
          ISSUE_BODY_FILE: ${{ runner.temp }}/nightly-issue.md
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.report.outputs.outcome != 'pass' }}
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 14
      - name: Open the issue unless one with the same title is open
        if: ${{ !cancelled() && steps.report.outputs.outcome != 'pass' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Fallbacks for a report step that crashed: still open a bug.
          TITLE: ${{ steps.report.outputs.title || 'Nightly e2e failed against the live site' }}
          LABEL: ${{ steps.report.outputs.label || 'bug' }}
          BODY_FILE: ${{ runner.temp }}/nightly-issue.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json title --jq '.[] | select(.title == env.TITLE) | .title')
          if [ -n "$existing" ]; then
            echo "An open issue with this title exists, not creating another."
            exit 0
          fi
          [ -s "$BODY_FILE" ] || echo "The nightly run failed and its issue body could not be written. Run: $RUN_URL" > "$BODY_FILE"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "$LABEL" --body-file "$BODY_FILE"
