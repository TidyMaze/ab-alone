name: Pages

on:
  # Only a merge that changes what the built game is made of deploys (#479): docs, tests, e2e, CI and tooling don't.
  push:
    branches: [main]
    paths:
      - 'client/index.html'
      - 'client/public/**'
      - 'client/src/**'
      - '!client/src/**/*.test.ts'
      - '!client/src/test/**'
      - 'client/scripts/offline-app.mjs'
      - 'client/package.json'
      - 'client/bun.lock'
      - 'client/tsconfig.json'
      - 'client/vite.config.ts'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/abalone-core/Cargo.toml'
      - 'crates/abalone-core/src/**'
      - 'crates/abalone-wasm/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: wasm-cache
        uses: actions/cache@v4
        with:
          path: crates/abalone-wasm/pkg
          key: wasm-pkg-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/abalone-wasm/**', 'crates/abalone-core/**') }}
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: wasm-pack build crates/abalone-wasm --target web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: client/package.json
      - run: bun install --frozen-lockfile
        working-directory: client
      - run: bunx tsc --noEmit && bunx vite build
        working-directory: client
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
