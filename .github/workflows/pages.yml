name: Pages

on:
  # Deploy only after a green CI on main (#1433). A test-only commit redeploys too: a cancelled CI run would otherwise lose a deploy.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The commit CI tested, not the head of main: it is the one that was green (#1433). Runs can finish out of
      # order (#1267); the concurrency group keeps only the newest deploy.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
      - id: wasm-cache
        uses: actions/cache@v4
        with:
          path: crates/edgefall-wasm/pkg
          key: wasm-pkg-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/edgefall-wasm/**', 'crates/edgefall-core/**') }}
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # wasm-opt from the Actions cache, so a GitHub release outage cannot fail wasm-pack (#1648).
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/wasm-opt
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: wasm-pack build crates/edgefall-wasm --target web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: client/package.json
      - run: bun install --frozen-lockfile
        working-directory: client
      # The KTX2 encodes of the textures (#700), by the hash of each source: only a changed texture is encoded again.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ab-alone-ktx2
          key: ktx2-${{ hashFiles('client/textures/**', 'client/scripts/ktx2-textures.mjs', 'client/bun.lock') }}
          restore-keys: ktx2-
      - run: bunx tsc --noEmit && bunx vite build
        working-directory: client
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
