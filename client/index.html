<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d0f" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>AB-ALONE</title>
    <script>
      // The theme (#317) before the first paint: Dark or Light when the player picked one, else the system setting.
      try {
        const theme = localStorage.getItem('ab-alone.theme');
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
        const palette = localStorage.getItem('ab-alone.palette');
        if (palette) document.documentElement.dataset.palette = palette;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="loading" role="status"><div class="plate"><span class="hex" aria-hidden="true"></span><span>Loading</span></div></div>
    <div id="boot-error" role="alert" hidden>
      <p>The game could not start: <span id="boot-reason"></span></p>
      <button id="boot-reload" type="button">Reload</button>
    </div>
    <div id="chrome">
      <div id="boss-bar" hidden></div>
      <div id="hud-dock">
        <div id="hud" role="status" aria-live="polite"></div>
        <button id="hud-fold" type="button" aria-label="HUD panel" aria-expanded="true" aria-controls="hud" title="Fold the panel" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
      <div id="openworld-hud" role="status">
        <p>Open world: arrows or a click on a next cell to roll, Esc to leave.</p>
        <p>Seed <output id="openworld-seed"></output>, shared as <code>?openworld=&lt;seed&gt;</code> in the address bar.</p>
        <button id="openworld-new" type="button">New world</button>
        <div id="openworld-confirm" hidden>
          <p>Discard the save of this world and start a new random world?</p>
          <button id="openworld-keep" type="button">Keep this world</button>
          <button id="openworld-discard" type="button">Discard and start new</button>
        </div>
      </div>
      <div id="fps" aria-hidden="true" hidden></div>
      <div id="online">
        <button id="update" type="button" hidden>New version: reload</button>
        <div id="settings-box">
          <button id="settings" type="button" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="settings-menu" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M10.3 2h3.4l.5 2.6 1.9.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.9 2.6.5v3.4l-2.6.5-.8 1.9 1.5 2.2-2.4 2.4-2.2-1.5-1.9.8-.5 2.6h-3.4l-.5-2.6-1.9-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.9L2 13.7v-3.4l2.6-.5.8-1.9-1.5-2.2 2.4-2.4 2.2 1.5 1.9-.8z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <div id="settings-menu" role="group" aria-label="Settings" hidden></div>
        </div>
        <div id="group-view" class="group">
          <button id="reset-view" type="button" disabled>Reset view</button>
        </div>
        <div id="group-game" class="group">
          <button id="new-game" type="button" disabled>New game</button>
          <button id="rematch" type="button" hidden>Rematch</button>
          <button id="boss-goal" type="button" aria-expanded="true" hidden>Goal</button>
          <button id="boss-retry" type="button" hidden>Retry</button>
          <button id="royale-hold" type="button" hidden>Hold</button>
          <button id="royale-start" type="button" hidden>Start</button>
          <button id="royale-invite" type="button" hidden>Invite</button>
          <button id="ship-back" type="button" hidden>Back to the ship</button>
        </div>
        <div id="daily-card" hidden>
          <textarea id="daily-result" readonly rows="3" aria-label="Daily challenge result"></textarea>
          <button id="daily-copy" type="button">Copy result</button>
        </div>
        <div id="tools" class="group">
          <button id="hint" type="button" aria-pressed="false" disabled>Hint</button>
          <button id="replay" type="button" disabled>Replay</button>
          <button id="auto-play" type="button" aria-pressed="false" aria-describedby="auto-reason" hidden>Auto-play</button>
        </div>
        <span id="auto-reason" hidden></span>
        <button id="modes" type="button" aria-label="Game modes" title="Game modes" aria-haspopup="true" aria-expanded="false" aria-controls="mode-menu" disabled></button>
        <div id="mode-menu" role="group" aria-label="Game modes" hidden>
          <button id="play-online" type="button" disabled>Play online</button>
          <button id="fight-together" type="button" aria-expanded="false" disabled>Fight together</button>
          <div id="coop-list" hidden></div>
          <button id="battle-royale" type="button" disabled>Battle royale</button>
          <button id="ranked" type="button" disabled>Ranked</button>
          <button id="boss-fight" type="button" aria-expanded="false" disabled>Boss fight</button>
          <div id="boss-list" hidden></div>
          <button id="daily" type="button" disabled>Daily challenge</button>
          <button id="roguelite" type="button" disabled>Rogue-lite run</button>
          <button id="openworld" type="button" disabled>Open world</button>
          <button id="ship" type="button" disabled>Ship</button>
        </div>
        <input id="import-file" type="file" accept=".json,application/json" hidden aria-label="Game file" />
        <label id="invite-label" for="invite" hidden>Invite link: send it to your opponent</label>
        <div id="invite-row">
          <input id="invite" type="text" readonly hidden aria-label="Invite link" />
          <button id="invite-copy" type="button" hidden>Copy</button>
        </div>
      </div>
      <div id="log" role="region" aria-label="Audio log">
        <p id="transcript" aria-live="polite" hidden></p>
        <button id="log-button" type="button" hidden>Play log</button>
      </div>
    </div>
    <div id="support">
      <div id="replay-bar" role="group" aria-label="Replay" hidden>
        <input id="replay-slider" type="range" min="0" max="0" step="1" value="0" aria-label="Position in the move log" />
        <div id="replay-label" aria-live="polite"></div>
        <div class="steps">
          <button id="replay-first" type="button" aria-label="First position" title="First position">&#9198;</button>
          <button id="replay-prev" type="button" aria-label="Previous move (Left)" title="Previous move (Left)">&#9664;</button>
          <button id="replay-next" type="button" aria-label="Next move (Right)" title="Next move (Right)">&#9654;</button>
          <button id="replay-last" type="button" aria-label="Last position" title="Last position">&#9197;</button>
          <button id="replay-live" type="button" title="Back to the live game (Esc)">Live</button>
        </div>
      </div>
      <div id="eval" hidden>
        <div class="track" role="meter" aria-label="Evaluation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="Even">
          <div class="black"></div>
        </div>
        <div class="label" aria-hidden="true">Even</div>
      </div>
      <textarea id="diagnostics" readonly hidden aria-label="Diagnostics"></textarea>
      <button id="copy-diagnostics" type="button" disabled>Copy diagnostics</button>
    </div>
    <div id="run-map" role="region" aria-label="Rogue-lite map" hidden></div>
    <div id="bubble" hidden><span id="bubble-text" aria-hidden="true"></span><span id="bubble-line" role="status"></span></div>
    <div id="reader" role="region" aria-label="Terminal" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
