<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d0f" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>AB-ALONE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="chrome">
      <div id="hud" role="status" aria-live="polite"></div>
      <div id="online">
        <button id="update" type="button" hidden>New version: reload</button>
        <button id="clear-board" type="button" aria-pressed="false" disabled>Clear board</button>
        <button id="sound" type="button" aria-pressed="true" disabled>Sound</button>
        <button id="reset-view" type="button" disabled>Reset view</button>
        <button id="play-online" type="button" disabled>Play online</button>
        <button id="rematch" type="button" hidden>Rematch</button>
        <button id="boss-fight" type="button" aria-expanded="false" disabled>Boss fight</button>
        <div id="boss-list" hidden></div>
        <button id="daily" type="button" disabled>Daily challenge</button>
        <button id="boss-retry" type="button" hidden>Retry</button>
        <button id="copy-diagnostics" type="button" disabled>Copy diagnostics</button>
        <label id="invite-label" for="invite" hidden>Invite link: send it to your opponent</label>
        <input id="invite" type="text" readonly hidden aria-label="Invite link" />
        <textarea id="diagnostics" readonly hidden aria-label="Diagnostics"></textarea>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
